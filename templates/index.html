<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мессенджер</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #262b38;
    --text: #e6e9f0;
    --muted: #8a92a6;
    --accent: #5b8cff;
    --accent-dark: #3a63d8;
    --msg-self: #24314f;
    --msg-other: #1e212c;
  }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  header .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #7a5bff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #fff;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .you {
    margin-left: auto;
    font-size: 14px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  #yourName { color: var(--text); font-weight: 600; }
  #changeName {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 4px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  #changeName:hover { color: var(--text); border-color: var(--accent); }
  #messages {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 68%; display: flex; flex-direction: column; gap: 2px; }
  .msg .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
  .msg .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--msg-other);
    border: 1px solid var(--border);
    line-height: 1.4;
    font-size: 15px;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.mine .bubble {
    background: var(--msg-self);
    border-color: var(--accent-dark);
    border-bottom-right-radius: 4px;
  }
  .msg.other { align-self: flex-start; align-items: flex-start; }
  .msg.other .bubble { border-bottom-left-radius: 4px; }
  .msg .name { font-weight: 600; font-size: 13px; }
  .msg .time { font-size: 11px; }
  .empty {
    margin: auto;
    color: var(--muted);
    text-align: center;
    font-size: 14px;
    padding: 20px;
  }
  footer {
    flex: 0 0 auto;
    padding: 12px 20px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px 16px;
    font-size: 15px;
    outline: none;
    resize: none;
    font-family: inherit;
    max-height: 140px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    border: none;
    color: #fff;
    border-radius: 12px;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:hover { background: var(--accent-dark); }
  #send:disabled { opacity: 0.5; cursor: default; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  @media (max-width: 600px) {
    .msg { max-width: 85%; }
    header h1 { font-size: 16px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">М</div>
    <h1>Мессенджер</h1>
    <div class="you">
      Вы: <span id="yourName">...</span>
      <button id="changeName">Сменить имя</button>
    </div>
  </header>

  <div id="messages">
    <div class="empty">Пока нет сообщений. Напишите первым!</div>
  </div>

  <footer>
    <textarea id="input" rows="1" placeholder="Введите сообщение..." maxlength="1000"></textarea>
    <button id="send" disabled>Отправить</button>
  </footer>

<script>
(function () {
  const elMessages = document.getElementById('messages');
  const elInput = document.getElementById('input');
  const elSend = document.getElementById('send');
  const elYourName = document.getElementById('yourName');
  const elChangeName = document.getElementById('changeName');

  let myName = '';
  let lastId = 0;
  let pending = false;

  const colorFor = (name) => {
    let h = 0;
    for (const c of name) h = (h * 31 + c.codePointAt(0)) % 360;
    return `hsl(${h}, 70%, 65%)`;
  };
  const escapeHtml = (s) =>
    s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
     .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const fmtTime = (t) => {
    const d = new Date(t * 1000);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };

  async function fetchMe() {
    try {
      const r = await fetch('/api/me');
      const data = await r.json();
      myName = data.name;
      elYourName.textContent = myName || '(не задано)';
      if (!myName) setName();
    } catch (e) { /* ignore */ }
  }

  async function setName() {
    const name = prompt('Как вас зовут?', myName || '');
    if (!name) { if (!myName) setName(); return; }
    try {
      const r = await fetch('/api/me', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.trim() })
      });
      const data = await r.json();
      myName = data.name;
      elYourName.textContent = myName;
    } catch (e) { /* ignore */ }
  }

  function addMessage(m) {
    if (document.querySelector(`.msg[data-id="${m.id}"]`)) return;
    const empty = document.querySelector('.empty');
    if (empty) empty.remove();

    const nearBottom = elMessages.scrollHeight - elMessages.scrollTop - elMessages.clientHeight < 80;

    const div = document.createElement('div');
    div.className = 'msg ' + (m.name === myName ? 'mine' : 'other');
    div.dataset.id = m.id;

    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('span');
    name.className = 'name';
    name.style.color = colorFor(m.name);
    name.textContent = m.name;
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = fmtTime(m.time);
    meta.appendChild(name);
    meta.appendChild(time);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.text;

    div.appendChild(meta);
    div.appendChild(bubble);
    elMessages.appendChild(div);

    if (nearBottom) elMessages.scrollTop = elMessages.scrollHeight;
    if (m.id > lastId) lastId = m.id;
  }

  async function poll() {
    try {
      const r = await fetch('/api/messages?after=' + lastId);
      const data = await r.json();
      for (const m of data) addMessage(m);
    } catch (e) { /* ignore */ }
  }

  async function send() {
    const text = elInput.value.trim();
    if (!text || pending || !myName) return;
    pending = true;
    elSend.disabled = true;
    try {
      const r = await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: myName, text: text })
      });
      if (r.ok) {
        const m = await r.json();
        addMessage(m);
        elInput.value = '';
        elInput.style.height = 'auto';
      }
    } catch (e) { /* ignore */ }
    pending = false;
    elSend.disabled = false;
    elInput.focus();
  }

  elSend.addEventListener('click', send);
  elInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  elInput.addEventListener('input', () => {
    elInput.style.height = 'auto';
    elInput.style.height = Math.min(elInput.scrollHeight, 140) + 'px';
    elSend.disabled = !elInput.value.trim();
  });
  elChangeName.addEventListener('click', setName);

  fetchMe();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
