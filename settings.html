<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кокаколик — настройки</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #0d0d1e; color: #e8e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #1a1a2e; border: 1px solid #2a2a44; border-radius: 16px; padding: 32px; width: 460px; max-width: 92vw; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  h1 { font-size: 22px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  h1 img { width: 36px; height: 36px; border-radius: 50%; }
  p.sub { color: #8a8aa8; font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: #b9b9d4; margin: 16px 0 6px; font-weight: 600; }
  select, input, textarea { width: 100%; background: #12122a; border: 1px solid #2a2a44; border-radius: 10px; color: #e8e8f0; padding: 10px 12px; font-size: 14px; outline: none; }
  select:focus, input:focus { border-color: #7c7cf0; }
  .row { display: flex; gap: 8px; }
  .row select { flex: 1; }
  button { width: 100%; background: #7c7cf0; border: none; color: #fff; font-size: 15px; font-weight: 700; padding: 12px; border-radius: 12px; cursor: pointer; margin-top: 24px; }
  button:hover { background: #9090ff; }
  button:disabled { background: #3a3a5a; cursor: default; }
  .status { font-size: 12px; color: #8a8aa8; margin-top: 12px; line-height: 1.5; }
  .hint { font-size: 12px; color: #6a6a88; margin-top: 16px; line-height: 1.5; }
  .err { color: #ff6b6b; font-size: 13px; margin-top: 10px; display: none; }
  .spinner { display: none; text-align: center; margin-top: 18px; color: #7c7cf0; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1><img src="https://raw.githubusercontent.com/matvey-matvey123/messenger/master/ikon.png" alt=""><span>Кокаколик</span></h1>
    <p class="sub">Выберите сервер и прокси для подключения</p>

    <label>Сервер</label>
    <select id="serverSel">
      <option value="https://messenger.matveygorvat.workers.dev/">Кокаколик (основной, без VPN)</option>
      <option value="https://matveymatveyg.pythonanywhere.com/">PythonAnywhere (нужен прокси)</option>
      <option value="custom">Свой URL...</option>
    </select>
    <input id="serverCustom" placeholder="https://..." style="margin-top:8px;display:none;">

    <label>Прокси (чтобы работать без VPN)</label>
    <select id="proxySel">
      <option value="">Без прокси</option>
    </select>

    <button id="connectBtn">Сохранить и подключиться</button>
    <div id="err" class="err"></div>
    <div id="spinner" class="spinner">Перезапуск... <br>Подождите</div>
    <div id="status" class="status"></div>
    <div class="hint">Если включить прокси — мессенджер будет работать без системного VPN. При первом запуске прокси автоматически скачается sing-box (нужен интернет).</div>
  </div>

<script>
  let api = null;
  window.addEventListener('pywebviewready', () => { api = window.pywebview.api; init(); });

  async function init() {
    if (!api) return;
    try {
      const s = await api.get_state();
      document.getElementById('proxySel').innerHTML = '';
      let has = false;
      for (const p of s.proxies) {
        const o = document.createElement('option');
        o.value = p.id; o.textContent = p.name;
        if (p.name.indexOf('Дания') === 0) o.textContent = '🇩🇰 ' + p.name;
        document.getElementById('proxySel').appendChild(o);
        if (p.id === s.proxy_id) { o.selected = true; has = true; }
      }
      if (!has) {
        for (const opt of document.getElementById('proxySel').options) {
          if (opt.value) { opt.selected = true; break; }
        }
      }
      if (String(s.server).indexOf('pythonanywhere') === -1) {
        document.getElementById('proxySel').value = '';
      }
      const sel = document.getElementById('serverSel');
      const customIsPreset = ['https://messenger.matveygorvat.workers.dev/', 'https://matveymatveyg.pythonanywhere.com/'].includes(s.server) || String(s.server).indexOf('workers.dev') !== -1;
      sel.value = customIsPreset ? s.server : 'custom';
      const ci = document.getElementById('serverCustom');
      ci.style.display = sel.value === 'custom' ? 'block' : 'none';
      ci.value = customIsPreset ? '' : s.server;
      document.getElementById('status').textContent = s.proxy_status;
    } catch (e) { showErr(String(e)); }
  }

  function showErr(m) { const e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; }

  document.getElementById('serverSel').addEventListener('change', () => {
    const ci = document.getElementById('serverCustom');
    ci.style.display = document.getElementById('serverSel').value === 'custom' ? 'block' : 'none';
  });

  document.getElementById('connectBtn').addEventListener('click', async () => {
    let server = document.getElementById('serverSel').value;
    if (server === 'custom') {
      server = document.getElementById('serverCustom').value.trim();
      if (!/^https?:\/\//.test(server)) { showErr('Введите полный URL: https://...'); return; }
    }
    document.getElementById('connectBtn').disabled = true;
    document.getElementById('spinner').style.display = 'block';
    let proxyId = document.getElementById('proxySel').value;
    if (server.indexOf('pythonanywhere') === -1) proxyId = '';
    try {
      await api.save_and_connect(server, proxyId);
    } catch (e) {
      showErr(String(e));
      document.getElementById('connectBtn').disabled = false;
      document.getElementById('spinner').style.display = 'none';
    }
  });
</script>
</body>
</html>
